[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-developer-assistant"
version = "0.1.0"
description = "MCP server providing intelligent analysis and diagnostics for Odoo developers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [
    { name = "pks0204", email = "pranavks5380@gmail.com" }
]
keywords = ["odoo", "mcp", "model-context-protocol", "developer-tools", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
odoo-developer-assistant = "server:main"
odoo-assistant = "server:main"

[tool.setuptools]
py-modules = ["server"]
